<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Architecture portfolio showcasing residential, cultural, and public projects">
  <title>Architecture Portfolio</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="assets/logo_white.png">
  <link rel="apple-touch-icon" href="assets/logo_white.png">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <!-- Stylesheet -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Fixed Header -->
  <header>
    <div class="header-content">
      <a href="index.html" class="logo">
          <img src="assets/logo_white.png" alt="" class="logo-image logo-light">
          <img src="assets/logo_black.png" alt="" class="logo-image logo-dark">
          <span>Carlota Azenha da Rocha</span>
        </a>
      <nav>
        <ul>
          <li><a href="index.html">Projects</a></li>
          <li><a href="about.html">About</a></li>
        </ul>
        <button class="menu-toggle" aria-label="Toggle menu">
          <svg class="menu-open" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          <svg class="menu-close" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
        <div class="language-switcher">
          <button class="lang-btn" data-lang="pt">PT</button>
          <span class="lang-separator">/</span>
          <button class="lang-btn active" data-lang="en">EN</button>
          <span class="lang-separator">/</span>
          <button class="lang-btn" data-lang="es">ES</button>
        </div>
        <button id="dark-mode-toggle" class="dark-mode-toggle" aria-label="Toggle dark mode">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
      </nav>
    </div>
  </header>

  <!-- Main Content -->
  <main>
    <div id="projects-grid" class="projects-grid">
      <!-- Projects loaded dynamically via JavaScript -->
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <p>© 2026. All rights reserved.</p>
  </footer>

  <!-- JavaScript -->
  <script src="js/main.js"></script>
</body>
</html>
