<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Carlota Azenha da Rocha — Em manutenção</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root { --text: #1a1a1a; --muted: #636363; --accent: #a32a2a; --bg: #ffffff; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 2rem 1rem; background: var(--bg); color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    main { max-width: 32rem; }
    .name { font-size: 0.875rem; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 3rem; }
    h1 { font-size: 1.75rem; font-weight: 400; margin-bottom: 1.25rem; }
    h1::after { content: ""; display: block; width: 2.5rem; height: 2px; background: var(--accent); margin-top: 1.25rem; }
    p { font-size: 1rem; line-height: 1.7; font-weight: 400; text-align: justify; }
    p + p { margin-top: 1rem; }
    .en { color: var(--muted); font-size: 0.875rem; margin-top: 2.5rem; }
  </style>
</head>
<body>
  <main>
    <div class="name">Carlota Azenha da Rocha</div>
    <h1>Site em manutenção</h1>
    <p>Este site está temporariamente indisponível. Obrigado pela compreensão.</p>
    <p class="en">This website is temporarily under maintenance. Thank you for your understanding.</p>
  </main>
</body>
</html>
